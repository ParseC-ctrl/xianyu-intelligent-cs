name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          python -m venv worker/.venv
          worker/.venv/bin/pip install -r worker/requirements.txt
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Validate source and customer service contracts
        run: |
          npm run test:repository
          python tests/public-data-contract.py
          python tests/windows-launcher-shell-contract.py
          npm run test:syntax
          npm run test:ai
          npm run test:knowledge
          npm run test:auto-worker
          npm run test:deploy
          npm run test:docker-install

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Windows PowerShell 5.1 launcher
        shell: powershell
        run: tests/windows-launcher-contract.ps1
